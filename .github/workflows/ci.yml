name: LegalEase CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Type-Check, Audit & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 mypy pip-audit email-validator

      - name: Lint with flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Type-check with mypy
        run: |
          mypy app/ --ignore-missing-imports || true

      - name: Security audit with pip-audit
        run: |
          pip-audit --desc || true

      - name: Run Pytest test suite & Quality Evals
        run: |
          python -m pytest tests/ evals/ -v

  frontend-checks:
    name: Frontend Lint, Type-Check, Audit & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run type-check

      - name: Security audit with npm audit
        run: npm audit --audit-level=high || true

      - name: Run Vitest tests
        run: npm test -- --run
