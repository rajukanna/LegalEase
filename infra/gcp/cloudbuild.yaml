steps:
  # 1. Build Backend Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/legalease-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/legalease-backend:latest', '-f', 'infra/Dockerfile.backend', '.']

  # 2. Build Frontend Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/legalease-frontend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/legalease-frontend:latest', '-f', 'infra/Dockerfile.frontend', '.']

  # 3. Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/legalease-backend:$COMMIT_SHA']

  # 4. Push Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/legalease-frontend:$COMMIT_SHA']

  # 5. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'legalease-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/legalease-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'

  # 6. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'legalease-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/legalease-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'

images:
  - 'gcr.io/$PROJECT_ID/legalease-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/legalease-frontend:$COMMIT_SHA'
